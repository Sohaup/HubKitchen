<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href=<?= __DIR__ . "/styles/success.css" ?>/> -->
    <style>
        body {
            background-color: whitesmoke;
            margin: 0px;
            padding: 0px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            justify-items: center;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 5px 5px 5px black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: translateY(50%);
            padding-block: 20px;
        }

        .card-img {
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            /* background-color: blue; */
        }

        .card-body h1 {
            color: rgb(116, 11, 116);
            font-size: 25px;
            font-weight: bold;
            text-align: center;
        }

        .card-body p {
            color: rgb(115, 113, 113);
            font-size: 12px;
            width: 50%;
            text-align: center;
            align-self: center;

        }

        .card-footer {
            display: flex;
            justify-content: center;
            /* padding-block: 10px; */
        }

        .card-footer button {
            border-radius: 6px;
            background-color: rgb(128, 0, 92);
            color: white;
            font-weight: bold;
            text-align: center;
            margin: 5px;
            padding: 5px;
            font-size: 19px;
            padding-inline: 5px;

        }
    </style>
</head>

<body>
    <div class="card ">
        <div class="card-img">
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 48 48">
                <path d="M0 0h48v48H0z" fill="none" />
                <path fill="#1aa740" fill-rule="evenodd" stroke="#1aa740" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="4" d="m4 24l5-5l10 10L39 9l5 5l-25 25z" clip-rule="evenodd" />
            </svg>
        </div>
        <div class="card-body">
            <h1>Payment successful</h1>
            <p>
                Your payment is processing successfully
                now you can return to the home
                page and discover new products
            </p>
        </div>
        <div class="card-footer">
            <button>Return Home</button>
        </div>
    </div>
</body>

</html>
